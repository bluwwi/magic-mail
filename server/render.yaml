services:
  - type: web
    name: magic-mail
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_DOMAINS
        sync: false
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        value: sqlite:/var/data/tempmail.db?mode=rwc
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_HOSTNAME
        sync: false
      - key: EMAIL_TTL_MINUTES
        value: 10
    disk:
      name: magic-mail-data
      mountPath: /var/data
      sizeGB: 1
